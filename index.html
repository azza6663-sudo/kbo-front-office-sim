function staffPage(){return pagehead("스태프·육성","훈련 계획으로 구단 분위기와 육성 목표를 관리합니다.")+'<div class="tilegrid">'+[["투수 컨디션 관리","선발 로테이션과 불펜 휴식일을 조정합니다."],["타격 집중 훈련","타격 코치와 팀 배팅을 진행합니다."],["수비·주루 캠프","수비 조직력과 베이스러닝을 점검합니다."]].map(function(x){return'<article class="tile"><small>이번 주 육성 계획</small><h3>'+x[0]+'</h3><p>'+x[1]+'</p><button style="margin-top:10px" class="quiet" data-act="train" data-name="'+x[0]+'">훈련 실행</button></article>'}).join("")+'</div><div class="notice">훈련 효과는 시뮬레이션 저장값으로 적용됩니다.</div></div>'}
function leaguePage(){return pagehead("리그 순위","경기를 진행하면 승·패와 순위가 갱신됩니다.",'<button class="quiet" data-act="advance">경기 진행</button>')+'<section class="card"><div class="cardhead"><h2>2026 정규시즌 · 게임 데이터</h2><span class="muted">진행 '+state.games+'경기</span></div><div class="body">'+standings()+"</div></section><div class="notice">실제 KBO 순위가 아닌 게임 시뮬레이션 순위입니다.</div></div>"}
function financePage(){return pagehead("구단·재정","예산과 구단주 신뢰도를 관리합니다. 모든 금액은 게임용입니다.")+'<div class="tilegrid">'+[["예산 여유",Number(state.budget).toFixed(2)+"억"],["보유 자금",Number(state.cash).toFixed(2)+"억"],["연봉 상한 잔여","18.40억"],["구단 신뢰도",state.trust+" / 100"]].map(function(x){return'<article class="tile"><small>시뮬레이션 재정</small><h3>'+x[0]+'</h3><p style="font-size:19px;color:#eef5fa;font-weight:800;margin-top:9px">'+x[1]+"</p></article>"}).join("")+'</div><div class="notice">예산 사용과 영입은 이 브라우저에 저장됩니다.</div></div>'}
function historyPage(){return'<div class="subpage"><div class="legend-banner"><h2>'+team(state.team).name+' 구단 역사</h2><p>현역 선수단과 별도로 구단을 빛낸 은퇴 레전드의 기록을 보존합니다.</p></div><div class="tilegrid">'+(legends[state.team]||[]).map(function(l,i){return'<article class="tile"><small>구단 레전드 기록 · '+(i+1)+'</small><h3>'+esc(l[0])+'</h3><p style="color:#82b3ff;margin-bottom:5px">'+esc(l[1])+'</p><p>'+esc(l[2])+'</p></article>'}).join("")+'</div><div class="notice">역사 기록은 초안입니다. 통산 성적과 수상 내역은 공식 자료 확인 후 확장할 수 있습니다.</div></div>'}
function content(){let f={home:home,inbox:inboxPage,roster:rosterPage,trades:tradePage,signings:signingPage,staff:staffPage,league:leaguePage,finance:financePage,history:historyPage};return(f[state.page]||home)()}
function draw(){let c=team(state.team);document.documentElement.style.setProperty("--accent",c.color);document.getElementById("clubSelect").innerHTML=clubs.map(function(x){return'<option value="'+x.id+'">'+x.name+"</option>"}).join("");document.getElementById("clubSelect").value=state.team;document.getElementById("dateText").textContent=dateText();document.getElementById("budgetSide").textContent=Number(state.budget).toFixed(2)+"억";document.getElementById("trustSide").textContent=state.trust;document.getElementById("sideNav").innerHTML=menu.map(function(n){return'<button class="nav '+(state.page===n[0]?"active":"")+'" data-go="'+n[0]+'"><span class="ico">'+n[1]+'</span><span>'+n[2]+"</span></button>"}).join("");document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("active",b.dataset.go===state.page)});document.getElementById("content").innerHTML=content();save()}
function toast(s){let e=document.getElementById("toast");e.textContent=s;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},2200)}function advance(){let id=state.team,r=record(id),o=opponent(),win=Math.random()<.52;if(win)r[0]++;else r[1]++;state.records[id]=r;state.games++;let d=new Date(state.date+"T12:00:00");d.setDate(d.getDate()+1);state.date=d.toISOString().slice(0,10);state.trust=Math.max(0,Math.min(100,state.trust+(win?1:-1)));state.cash=Number((state.cash+.13).toFixed(2));let score=win?(3+Math.floor(Math.random()*5))+"-"+Math.floor(Math.random()*4):Math.floor(Math.random()*4)+"-"+(3+Math.floor(Math.random()*5));state.news.unshift({date:dateText(),tag:"경기 리포트",title:team(id).name+" "+(win?"승리":"패배")+" · "+score,body:team(id).name+"이(가) "+o.name+"와의 시뮬레이션 경기 결과를 기록했습니다. 다음 경기 운영 계획을 확인하세요."});state.news=state.news.slice(0,10);draw();toast("경기 종료 · "+(win?"승리":"패배")+" "+score)}function modal(s){document.getElementById("modalBody").innerHTML=s;document.getElementById("modal").showModal()}
function filterRoster(){let q=(document.getElementById("search").value||"").trim(),p=document.getElementById("posFilter").value;document.querySelectorAll(".prow").forEach(function(x){x.classList.toggle("hide",!(x.dataset.name.includes(q)&&(!p||x.dataset.pos===p)))})}
document.getElementById("clubSelect").addEventListener("change",function(){state.team=this.value;state.page="home";draw()});document.addEventListener("click",function(e){let go=e.target.closest("[data-go]");if(go){state.page=go.dataset.go;draw();return}let pl=e.target.closest("[data-player]");if(pl){let id=pl.dataset.player,p=null;clubs.forEach(function(c){roster(c.id).forEach(function(x){if(x.id===id)p=x})});if(p)modal('<h3>'+esc(p.name)+' · 선수 카드</h3><p>'+team(state.team).name+' · '+p.pos+'</p><div class="tile"><small>게임 능력치</small><h3>'+p.ovr+' / 100</h3><p>실제 기록이 아닌 시뮬레이션 수치</p></div>');return}let b=e.target.closest("[data-act]");if(!b)return;let a=b.dataset.act;if(a==="advance")advance();if(a==="close")document.getElementById("modal").close();if(a==="trade")toast(b.dataset.name+" 선수에게 협상 제안을 보냈습니다 · 게임 시뮬레이션");if(a==="train"){state.trust=Math.min(100,state.trust+2);state.news.unshift({date:dateText(),tag:"육성",title:b.dataset.name+" 완료",body:"훈련 계획을 실행했습니다. 게임 내 구단 신뢰도가 상승했습니다."});draw();toast("훈련 계획 완료")}if(a==="sign"){let cost=Number(b.dataset.cost);if(state.budget<cost){toast("예산이 부족합니다.");return}state.budget=Number((state.budget-cost).toFixed(2));let name=b.dataset.name;roster(state.team).push({id:state.team+"-sign-"+Date.now(),name:name,pos:b.dataset.pos,ovr:72+Math.floor(Math.random()*17)});state.news.unshift({date:dateText(),tag:"계약",title:name+" 영입 완료",body:"게임 시뮬레이션에만 반영된 거래입니다."});state.page="roster";draw();toast(name+" 영입 완료")}});draw();
</script></body></html>
