function toast(s){let e=document.getElementById("toast");e.textContent=s;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},2200)}function advance(){let id=state.team,r=record(id),o=opponent(),win=Math.random()<.52;if(win)r[0]++;else r[1]++;state.records[id]=r;state.games++;let d=new Date(state.date+"T12:00:00");d.setDate(d.getDate()+1);state.date=d.toISOString().slice(0,10);state.trust=Math.max(0,Math.min(100,state.trust+(win?1:-1)));state.cash=Number((state.cash+.13).toFixed(2));let score=win?(3+Math.floor(Math.random()*5))+"-"+Math.floor(Math.random()*4):Math.floor(Math.random()*4)+"-"+(3+Math.floor(Math.random()*5));state.news.unshift({date:dateText(),tag:"경기 리포트",title:team(id).name+" "+(win?"승리":"패배")+" · "+score,body:team(id).name+"이(가) "+o.name+"와의 시뮬레이션 경기 결과를 기록했습니다. 다음 경기 운영 계획을 확인하세요."});state.news=state.news.slice(0,10);draw();toast("경기 종료 · "+(win?"승리":"패배")+" "+score)}function playerModal(p){let pitcher=p.pos==="투수",rows=pitcher?[["구위",p.skills.stuff],["무브먼트",p.skills.movement],["제구",p.skills.control],["스태미나",p.skills.stamina],["좌타자 상대",p.skills.vsLeft],["우타자 상대",p.skills.vsRight],["견제·수비",p.skills.fielding],["체력",p.skills.fitness],["내구성",p.skills.durability]]:[["컨택",p.skills.contact],["파워",p.skills.power],["선구안",p.skills.discipline],["주루",p.skills.speed],["수비",p.skills.defense],["체력",p.skills.stamina]],line=function(x){return'<div class="finrow"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'},details=pitcher?'<h4>구종 능력</h4>'+pitchTypes.map(function(k){return line([k,p.pitchRatings[k]])}).join("")+'<div class="finrow"><span>직구 평균 구속</span><b>'+p.averageVelo+' km/h</b></div><div class="finrow"><span>직구 최고 구속</span><b>'+p.maxVelo+' km/h</b></div>':'<h4>타격 능력</h4>'+[["평균 타구속도",p.averageExitVelo+" km/h"],["갭 파워",p.batting.gapPower],["홈런 파워",p.batting.homeRunPower],["삼진 회피",p.batting.strikeoutAvoidance],["스피드",p.running.speed],["도루",p.running.stealing],["주루 센스",p.running.baserunningSense],["수비 범위",p.defenseStats.range],["내구성",p.durabili document.getElementById("clubSelect").addEventListener("change",function(){state.team=this.value;state.page="home";draw()});document.addEventListener("click",function(e){let teamPick=e.target.closest("[data-start-team]");if(teamPick){startChoice=teamPick.dataset.startTeam;renderStartScreen();return}let go=e.target.closest("[data-go]");if(go){state.page=go.dataset.go;draw();return}let pl=e.target.closest("[data-player]");if(pl){let id=pl.dataset.player,p=null;clubs.forEach(function(c){roster(c.id).forEach(function(x){if(x.id===id)p=x})});if(p)modal(playerModal(p));return}let b=e.target.closest("[data-act]");if(!b)return;let a=b.dataset.act;if(a==="chooseTeam")showStartScreen();if(a==="startSeason"){state.team=startChoice;state.started=true;state.page="home";save();document.getElementById("startScreen").classList.add("hide");draw();toast(team(state.team).name+" 구단으로 시작합니다")}if(a==="saveRoster"){let rows=Array.from(document.querySelectorAll("[data-editor-row]")),players=roster(state.team),updates=[];for(let i=0;i<rows.length;i++){let row=rows[i],p=players.find(function(x){return x.id===row.dataset.editorRow}),age=Number(row.querySelector("[data-edit-age]").value),pot=Number(row.querySelector("[data-edit-pot]").value),ratingInputs=Array.from(row.querySelectorAll("[data-edit-skill],[data-edit-bat],[data-edit-rundef],[data-edit-trait],[data-edit-pitch]")),bad=ratingInputs.some(function(x){let v=Number(x.value);return !Number.isInteger(v)||v<1||v>100});if(!p||!Number.isInteger(age)||age<15||age>60||!Number.isInteger(pot)||pot<1||pot>100||bad){toast("나이는 15~60세, 능력치와 잠재력은 1~100으로 입력하세요.");return}let pitcher=p.pos==="투수",nextOvr;if(pitcher){let sv={};row.querySelectorAll("[data-edit-skill]").forEach(function(x){sv[x.dataset.editSkill]=Number(x.value)});nextOvr=Math.round((sv.stuff+sv.movement+sv.control+sv.stamina)/4);let av=Number(row.querySelector("[data-edit-avgvelo]").value),mx=Number(row.querySelector("[data-edit-maxvelo]").value);if(!Number.isInteger(av)||!Number.isInt =="baserunningSense")p.running[k]=v;else if(k==="durability")p.durability=v;else p.defenseStats[k]=v});p.skills={contact:p.batting.contact,power:Math.round((p.batting.gapPower+p.batting.homeRunPower)/2),discipline:Math.round((p.batting.plateDiscipline+p.batting.strikeoutAvoidance)/2),speed:p.running.speed,defense:Math.round((p.defenseStats.range+p.defenseStats.fielding+p.defenseStats.arm+p.defenseStats.transfer)/4),stamina:Number(row.querySelector('[data-edit-skill="stamina"]').value)};p.averageExitVelo=Number(row.querySelector("[data-edit-exit]").value);p.ovr=Math.round((p.skills.contact+p.skills.power+p.skills.discipline+p.skills.speed+p.skills.defense+p.skills.stamina)/6)}});save();draw();toast(updates.length+"명 선수 정보 저장 완료")}if(a==="advance")advance();if(a==="close")document.getElementById("modal").close();if(a==="trade")toast(b.dataset.name+" 선수에게 협상 제안을 보냈습니다 · 게임 시뮬레이션");if(a==="train"){state.trust=Math.min(100,state.trust+2);state.news.unshift({date:dateText(),tag:"육성",title:b.dataset.name+" 완료",body:"훈련 계획을 실행했습니다. 게임 내 구단 신뢰도가 상승했습니다."});draw();toast("훈련 계획 완료")}if(a==="sign"){let cost=Number(b.dataset.cost);if(state.budget<cost){toast("예산이 부족합니다.");return}state.budget=Number((state.budget-cost).toFixed(2));let name=b.dataset.name;roster(state.team).push({id:state.team+"-sign-"+Date.now(),name:name,pos:b.dataset.pos,age:25+Math.floor(Math.random()*13),ovr:72+Math.floor(Math.random()*17)});state.news.unshift({date:dateText(),tag:"계약",title:name+" 영입 완료",body:"게임 시뮬레이션에만 반영된 거래입니다."});state.page="roster";draw();toast(name+" 영입 완료")}});migratePlayerData();draw();if(!state.started)showStartScreen();
